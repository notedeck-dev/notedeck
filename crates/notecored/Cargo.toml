[package]
name = "notecored"
version = "0.1.0"
edition = "2021"
description = "NoteDeck の常駐デーモン: notecore を WebView なしで動かし、同一ホストのアプリに Unix socket で RPC 面を公開する (#1106 段階 3a)"
license = "MIT"
publish = false

[[bin]]
name = "notecored"
path = "src/main.rs"

[dependencies]
notecore = { path = "../notecore" }
notecli = { path = "../notecli" }
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "sync", "net", "io-util", "signal"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
