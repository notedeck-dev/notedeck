[package]
name = "notecore"
version = "0.1.0"
edition = "2021"
description = "NoteDeck domain core — Tauri-independent, shared by the app and notecored"
repository = "https://github.com/notedeck-dev/notedeck"
license = "AGPL-3.0-only"
publish = false

[dependencies]
notecli = { path = "../notecli", features = ["specta"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
encoding_rs = "0.8"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
json5 = "1"
kamadak-exif = "0.6.1"
lru = "0.18"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
ulid = "1"
url = "2"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
# axum Router に直接リクエストを流して middleware を検査するため (oneshot)
tower = { version = "0.5", features = ["util"] }
