# #849 の試作。公開済みの Windows 版を MSIX に包み、runner に入れて起動できるかを確かめる。
# このブランチ専用で、main には入れない。
name: MSIX prototype (#849)

on:
  push:
    branches: [proto/msix-849]

jobs:
  proto:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 1.109.1
    steps:
      - uses: actions/checkout@v6

      - name: Download the released installer
        shell: pwsh
        run: |
          gh release download "v$env:VERSION" -p "NoteDeck-$env:VERSION-windows-x64-setup.exe" -D dl
          Get-ChildItem dl

      # NSIS の中身 (notedeck.exe と sidecar の notemaid.exe) を取り出すために、一度ふつうに入れる
      - name: Install silently and stage the files
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dl\*.exe)[0].FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter notedeck.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "installed notedeck.exe not found" }
          $dir = $exe.DirectoryName
          Write-Host "installed at: $dir"
          Get-ChildItem $dir | Format-Table Name, Length
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item "$dir\*" stage -Recurse -Exclude 'uninstall.exe'
          New-Item -ItemType Directory stage\Assets | Out-Null
          Copy-Item src-tauri\icons\StoreLogo.png, src-tauri\icons\Square150x150Logo.png, src-tauri\icons\Square44x44Logo.png stage\Assets
          (Get-Content scripts\msix-proto\AppxManifest.xml -Raw).Replace('__VERSION__', $env:VERSION) | Set-Content stage\AppxManifest.xml -Encoding utf8
          # 直接配布版を消して、以後は MSIX 版だけが動くようにする
          $un = Join-Path $dir 'uninstall.exe'
          if (Test-Path $un) { Start-Process $un -ArgumentList '/S' -Wait }
          Get-ChildItem stage -Recurse | Format-Table FullName, Length

      - name: Pack and sign (self-signed, test only)
        shell: pwsh
        run: |
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory | Where-Object { Test-Path "$($_.FullName)\x64\makeappx.exe" } | Sort-Object Name -Descending | Select-Object -First 1
          $bin = "$($kit.FullName)\x64"
          Write-Host "SDK: $bin"
          & "$bin\makeappx.exe" pack /d stage /p NoteDeck.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=NoteDeckProto' -KeyUsage DigitalSignature -FriendlyName 'NoteDeck proto' -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pwd = ConvertTo-SecureString -String 'proto' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath proto.pfx -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath proto.cer | Out-Null
          Import-Certificate -FilePath proto.cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          & "$bin\signtool.exe" sign /fd SHA256 /f proto.pfx /p proto NoteDeck.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Get-Item NoteDeck.msix | Format-List Name, Length

      # 直接配布版のデータが残っている端末を再現する: 包む前の exe をそのまま 25 秒動かして、
      # 本来の AppData にデータを作らせる
      - name: Seed real AppData with the unpackaged build
        shell: pwsh
        run: |
          $p = Start-Process "$PWD\stage\notedeck.exe" -PassThru
          Start-Sleep 25
          Get-Process notedeck, notemaid -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          "seed" | Set-Content "$env:APPDATA\com.notedeck.desktop\seed-marker.txt"
          Write-Host "== real Roaming after the unpackaged run"
          Get-ChildItem "$env:APPDATA\com.notedeck.desktop" -Recurse -File -ErrorAction SilentlyContinue | Select-Object @{n='Path';e={$_.FullName.Replace($env:APPDATA,'')}}, Length, LastWriteTime | Format-Table -AutoSize | Out-String -Width 220
          Write-Host "== real Local (top level)"
          Get-ChildItem "$env:LOCALAPPDATA\com.notedeck.desktop" -ErrorAction SilentlyContinue | Select-Object Name, LastWriteTime | Format-Table -AutoSize | Out-String -Width 220
          (Get-Date).ToString('o') | Set-Content seeded-at.txt

      - name: Pack a second package with file virtualization disabled
        shell: pwsh
        run: |
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory | Where-Object { Test-Path "$($_.FullName)\x64\makeappx.exe" } | Sort-Object Name -Descending | Select-Object -First 1
          $bin = "$($kit.FullName)\x64"
          Copy-Item stage stage2 -Recurse
          $m = Get-Content stage2\AppxManifest.xml -Raw
          $m = $m.Replace('Name="NotedeckDev.NoteDeck"', 'Name="NotedeckDev.NoteDeckUnvirt"')
          $m = $m.Replace('IgnorableNamespaces="uap rescap"', 'xmlns:desktop6="http://schemas.microsoft.com/appx/manifest/desktop/windows10/6" IgnorableNamespaces="uap rescap desktop6"')
          $m = $m.Replace('</Properties>', '  <desktop6:FileSystemWriteVirtualization>disabled</desktop6:FileSystemWriteVirtualization>' + "`n" + '    <desktop6:RegistryWriteVirtualization>disabled</desktop6:RegistryWriteVirtualization>' + "`n" + '  </Properties>')
          $m = $m.Replace('<rescap:Capability Name="runFullTrust" />', '<rescap:Capability Name="runFullTrust" />' + "`n" + '    <rescap:Capability Name="unvirtualizedResources" />')
          $m | Set-Content stage2\AppxManifest.xml -Encoding utf8
          Get-Content stage2\AppxManifest.xml
          & "$bin\makeappx.exe" pack /d stage2 /p NoteDeckUnvirt.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx (unvirt) failed" }
          & "$bin\signtool.exe" sign /fd SHA256 /f proto.pfx /p proto NoteDeckUnvirt.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool (unvirt) failed" }

      - name: "Experiment 1: virtualized package over existing data"
        shell: pwsh
        run: |
          $seeded = [datetime](Get-Content seeded-at.txt)
          Add-AppxPackage -Path NoteDeck.msix
          $pkg = Get-AppxPackage -Name NotedeckDev.NoteDeck
          $pfn = $pkg.PackageFamilyName
          Start-Process "shell:AppsFolder\$pfn!App"
          Start-Sleep 25
          Write-Host "== processes"
          Get-Process notedeck, notemaid -ErrorAction SilentlyContinue | Select-Object Name, Id, Path | Format-Table -AutoSize | Out-String -Width 220
          Write-Host "== resident registration from inside the package"
          & (Join-Path $pkg.InstallLocation 'notemaid.exe') service install
          Write-Host "exit: $LASTEXITCODE"
          Write-Host "-- real HKCU Run key as seen from outside the package:"
          reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v 'NoteDeck notemaid'
          Write-Host "-- as seen by the packaged notemaid:"
          & (Join-Path $pkg.InstallLocation 'notemaid.exe') service status
          Get-Process notedeck, notemaid -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          Write-Host "== real Roaming: files written AFTER the packaged run started (in-place writes to the unpackaged data)"
          Get-ChildItem "$env:APPDATA\com.notedeck.desktop" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -gt $seeded } | Select-Object @{n='Path';e={$_.FullName.Replace($env:APPDATA,'')}}, Length, LastWriteTime | Format-Table -AutoSize | Out-String -Width 220
          Write-Host "== package-private Roaming (redirected new files)"
          Get-ChildItem "$env:LOCALAPPDATA\Packages\$pfn\LocalCache\Roaming" -Recurse -File -ErrorAction SilentlyContinue | Select-Object @{n='Path';e={$_.FullName.Replace("$env:LOCALAPPDATA\Packages\$pfn",'')}}, Length, LastWriteTime | Format-Table -AutoSize | Out-String -Width 220
          Write-Host "== package-private Local (top two levels)"
          Get-ChildItem "$env:LOCALAPPDATA\Packages\$pfn\LocalCache\Local" -Depth 1 -ErrorAction SilentlyContinue | Select-Object @{n='Path';e={$_.FullName.Replace("$env:LOCALAPPDATA\Packages\$pfn",'')}} | Format-Table -AutoSize | Out-String -Width 220
          Remove-AppxPackage -Package $pkg.PackageFullName
          Write-Host "== after uninstall: does the private data remain?"
          Test-Path "$env:LOCALAPPDATA\Packages\$pfn"
          (Get-Date).ToString('o') | Set-Content exp1-done.txt

      - name: "Experiment 2: virtualization disabled"
        shell: pwsh
        run: |
          $t0 = [datetime](Get-Content exp1-done.txt)
          Add-AppxPackage -Path NoteDeckUnvirt.msix
          $pkg = Get-AppxPackage -Name NotedeckDev.NoteDeckUnvirt
          $pfn = $pkg.PackageFamilyName
          $pkg | Format-List Name, PackageFamilyName, SignatureKind
          Start-Process "shell:AppsFolder\$pfn!App"
          Start-Sleep 25
          Get-Process notedeck, notemaid -ErrorAction SilentlyContinue | Select-Object Name, Id, Path | Format-Table -AutoSize | Out-String -Width 220
          & (Join-Path $pkg.InstallLocation 'notemaid.exe') service install
          Write-Host "-- real HKCU Run key as seen from outside the package:"
          reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v 'NoteDeck notemaid'
          Get-Process notedeck, notemaid -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          Write-Host "== real Roaming: files written after this run started"
          Get-ChildItem "$env:APPDATA\com.notedeck.desktop" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -gt $t0 } | Select-Object @{n='Path';e={$_.FullName.Replace($env:APPDATA,'')}}, Length, LastWriteTime | Format-Table -AutoSize | Out-String -Width 220
          Write-Host "== package-private Roaming"
          Get-ChildItem "$env:LOCALAPPDATA\Packages\$pfn\LocalCache\Roaming" -Recurse -File -ErrorAction SilentlyContinue | Select-Object @{n='Path';e={$_.FullName.Replace("$env:LOCALAPPDATA\Packages\$pfn",'')}} | Format-Table -AutoSize | Out-String -Width 220
