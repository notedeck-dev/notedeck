# #849 の試作。公開済みの Windows 版を MSIX に包み、runner に入れて起動できるかを確かめる。
# このブランチ専用で、main には入れない。
name: MSIX prototype (#849)

on:
  push:
    branches: [proto/msix-849]

jobs:
  proto:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 1.109.1
    steps:
      - uses: actions/checkout@v6

      - name: Download the released installer
        shell: pwsh
        run: |
          gh release download "v$env:VERSION" -p "NoteDeck-$env:VERSION-windows-x64-setup.exe" -D dl
          Get-ChildItem dl

      # NSIS の中身 (notedeck.exe と sidecar の notemaid.exe) を取り出すために、一度ふつうに入れる
      - name: Install silently and stage the files
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dl\*.exe)[0].FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter notedeck.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "installed notedeck.exe not found" }
          $dir = $exe.DirectoryName
          Write-Host "installed at: $dir"
          Get-ChildItem $dir | Format-Table Name, Length
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item "$dir\*" stage -Recurse -Exclude 'uninstall.exe'
          New-Item -ItemType Directory stage\Assets | Out-Null
          Copy-Item src-tauri\icons\StoreLogo.png, src-tauri\icons\Square150x150Logo.png, src-tauri\icons\Square44x44Logo.png stage\Assets
          (Get-Content scripts\msix-proto\AppxManifest.xml -Raw).Replace('__VERSION__', $env:VERSION) | Set-Content stage\AppxManifest.xml -Encoding utf8
          # 直接配布版を消して、以後は MSIX 版だけが動くようにする
          $un = Join-Path $dir 'uninstall.exe'
          if (Test-Path $un) { Start-Process $un -ArgumentList '/S' -Wait }
          Get-ChildItem stage -Recurse | Format-Table FullName, Length

      - name: Pack and sign (self-signed, test only)
        shell: pwsh
        run: |
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory | Where-Object { Test-Path "$($_.FullName)\x64\makeappx.exe" } | Sort-Object Name -Descending | Select-Object -First 1
          $bin = "$($kit.FullName)\x64"
          Write-Host "SDK: $bin"
          & "$bin\makeappx.exe" pack /d stage /p NoteDeck.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=NoteDeckProto' -KeyUsage DigitalSignature -FriendlyName 'NoteDeck proto' -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pwd = ConvertTo-SecureString -String 'proto' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath proto.pfx -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath proto.cer | Out-Null
          Import-Certificate -FilePath proto.cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          & "$bin\signtool.exe" sign /fd SHA256 /f proto.pfx /p proto NoteDeck.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Get-Item NoteDeck.msix | Format-List Name, Length

      - name: Install the MSIX
        shell: pwsh
        run: |
          Add-AppxPackage -Path NoteDeck.msix
          Get-AppxPackage -Name NotedeckDev.NoteDeck | Format-List Name, PackageFamilyName, InstallLocation, Version, SignatureKind

      - name: Launch and observe
        shell: pwsh
        run: |
          $pkg = Get-AppxPackage -Name NotedeckDev.NoteDeck
          $pfn = $pkg.PackageFamilyName
          Write-Host "== WebView2 runtime"
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv
          Write-Host "== launch via AppsFolder"
          try { Start-Process "shell:AppsFolder\$pfn!App" } catch { Write-Host "AppsFolder launch failed: $_" }
          Start-Sleep 20
          if (-not (Get-Process notedeck -ErrorAction SilentlyContinue)) {
            Write-Host "== not running; launch the exe in the package directly"
            try { Start-Process (Join-Path $pkg.InstallLocation 'notedeck.exe') } catch { Write-Host "direct launch failed: $_" }
            Start-Sleep 20
          }
          Write-Host "== processes"
          Get-Process notedeck, notemaid -ErrorAction SilentlyContinue | Format-Table Name, Id, StartTime, Path
          Write-Host "== http server 19820"
          try { (Invoke-WebRequest 'http://127.0.0.1:19820/' -UseBasicParsing -TimeoutSec 5).StatusCode } catch { Write-Host "http: $($_.Exception.Message)" }
          Write-Host "== real AppData (what a non-packaged process sees)"
          Get-ChildItem "$env:APPDATA\com.notedeck.desktop" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 40 FullName
          Write-Host "== package-private AppData"
          Get-ChildItem "$env:LOCALAPPDATA\Packages\$pfn" -Recurse -Depth 5 -ErrorAction SilentlyContinue | Where-Object { -not $_.PSIsContainer -or $_.FullName -match 'notedeck' } | Select-Object -First 60 FullName
          Write-Host "== Run key (resident toggle would write here)"
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue | Format-List
          Write-Host "== app log tail"
          Get-ChildItem "$env:LOCALAPPDATA\Packages\$pfn","$env:LOCALAPPDATA\com.notedeck.desktop","$env:APPDATA\com.notedeck.desktop" -Recurse -Include *.log -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 30 }
          Write-Host "== application event log (crashes)"
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'notedeck|notemaid' } | Select-Object -First 5 TimeCreated, ProviderName, Message | Format-List
          if (-not (Get-Process notedeck -ErrorAction SilentlyContinue)) { throw "notedeck is not running inside the package" }

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: msix-proto
          path: NoteDeck.msix
