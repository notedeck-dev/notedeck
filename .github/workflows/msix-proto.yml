# #849 の試作。公開済みの Windows 版を MSIX に包み、振り替えの挙動をサーバー OS とクライアント OS で測る。
# このブランチ専用で、main には入れない。
name: MSIX prototype (#849)

on:
  push:
    branches: [proto/msix-849]

jobs:
  proto:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 1.109.1
    steps:
      - uses: actions/checkout@v6

      - name: OS
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object OsName, OsVersion, OsBuildNumber, OsArchitecture | Format-List
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv

      - name: Stage the released build
        shell: pwsh
        run: |
          gh release download "v$env:VERSION" -p "NoteDeck-$env:VERSION-windows-x64-setup.exe" -D dl
          $setup = (Get-ChildItem dl\*.exe)[0].FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter notedeck.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "installed notedeck.exe not found" }
          $dir = $exe.DirectoryName
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item "$dir\*" stage -Recurse -Exclude 'uninstall.exe'
          New-Item -ItemType Directory stage\Assets | Out-Null
          Copy-Item src-tauri\icons\StoreLogo.png, src-tauri\icons\Square150x150Logo.png, src-tauri\icons\Square44x44Logo.png stage\Assets
          (Get-Content scripts\msix-proto\AppxManifest.xml -Raw).Replace('__VERSION__', $env:VERSION) | Set-Content stage\AppxManifest.xml -Encoding utf8
          $un = Join-Path $dir 'uninstall.exe'
          if (Test-Path $un) { Start-Process $un -ArgumentList '/S' -Wait }
          Start-Sleep 3
          Write-Host "== NSIS-registered protocol after uninstall (should be gone):"
          reg query 'HKCU\Software\Classes\notedeck\shell\open\command' 2>&1 | Out-String
          $global:LASTEXITCODE = 0

      - name: Pack and sign (self-signed, test only)
        shell: pwsh
        run: |
          $mk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Sort-Object FullName -Descending | Select-Object -First 1
          $bin = $mk.DirectoryName
          Write-Host "SDK: $bin"
          & "$bin\makeappx.exe" pack /d stage /p NoteDeck.msix /o | Select-Object -Last 2
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=NoteDeckProto' -KeyUsage DigitalSignature -FriendlyName 'NoteDeck proto' -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pwd = ConvertTo-SecureString -String 'proto' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath proto.pfx -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath proto.cer | Out-Null
          Import-Certificate -FilePath proto.cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          & "$bin\signtool.exe" sign /fd SHA256 /f proto.pfx /p proto NoteDeck.msix | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }

      # 直接配布版のデータが残っている端末を再現する
      - name: Seed real AppData with the unpackaged build
        shell: pwsh
        run: |
          Start-Process "$PWD\stage\notedeck.exe"
          Start-Sleep 30
          Get-Process notedeck, notemaid -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          Write-Host "real Roaming exists: $(Test-Path "$env:APPDATA\com.notedeck.desktop\notecli.db")"
          Write-Host "real Local EBWebView exists: $(Test-Path "$env:LOCALAPPDATA\com.notedeck.desktop\EBWebView")"
          Write-Host "== protocol registered by the unpackaged run:"
          reg query 'HKCU\Software\Classes\notedeck\shell\open\command' 2>&1 | Out-String
          $global:LASTEXITCODE = 0

      - name: Measure inside the virtualized package
        shell: pwsh
        run: |
          function InPkg($cmdline) {
            try { Invoke-CommandInDesktopPackage -PackageFamilyName $script:pfn -AppId App -Command 'cmd.exe' -Args "/c $cmdline"; Start-Sleep 4 } catch { Write-Host "in-package command failed: $_" }
          }
          Add-AppxPackage -Path NoteDeck.msix
          $pkg = Get-AppxPackage -Name NotedeckDev.NoteDeck
          $script:pfn = $pkg.PackageFamilyName
          $priv = "$env:LOCALAPPDATA\Packages\$pfn\LocalCache"

          Write-Host "===== A. new files under EXISTING real folders (written by cmd.exe in the package context)"
          InPkg "echo x> `"%APPDATA%\com.notedeck.desktop\new-file.txt`" & mkdir `"%APPDATA%\com.notedeck.desktop\newdir`" & echo y> `"%APPDATA%\com.notedeck.desktop\newdir\inner.txt`" & echo l> `"%LOCALAPPDATA%\com.notedeck.desktop\new-local.txt`" & mkdir `"%APPDATA%\brand-new-app`" & echo z> `"%APPDATA%\brand-new-app\f.txt`""
          foreach ($f in 'Roaming\com.notedeck.desktop\new-file.txt','Roaming\com.notedeck.desktop\newdir\inner.txt','Local\com.notedeck.desktop\new-local.txt','Roaming\brand-new-app\f.txt') {
            $real = Join-Path (Split-Path $env:APPDATA) $f
            Write-Host ("{0,-55} real={1,-5} private={2}" -f $f, (Test-Path $real), (Test-Path (Join-Path $priv $f)))
          }

          Write-Host "===== B. HKCU write from the package context"
          InPkg "reg add HKCU\Software\NoteDeckProtoTest /v probe /t REG_SZ /d 1 /f & reg add HKCU\Software\Microsoft\Windows\CurrentVersion\Run /v NoteDeckProtoRun /t REG_SZ /d x /f"
          reg query 'HKCU\Software\NoteDeckProtoTest' /v probe 2>&1 | Out-String
          reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v NoteDeckProtoRun 2>&1 | Out-String
          $global:LASTEXITCODE = 0

          Write-Host "===== C. credential written from the package context"
          InPkg "cmdkey /generic:notedeck-proto-test /user:probe /pass:probe"
          Write-Host "-- seen from outside the package:"
          cmdkey /list:notedeck-proto-test | Out-String

          Write-Host "===== D. launch the app (existing unpackaged data present) and look at where IT writes"
          $t0 = Get-Date
          Start-Process "shell:AppsFolder\$pfn!App"
          Start-Sleep 30
          Get-Process notedeck, notemaid -ErrorAction SilentlyContinue | Select-Object Name, Id | Format-Table -AutoSize | Out-String
          Write-Host "-- protocol command in the real HKCU after the packaged app started (the app calls register() at startup):"
          reg query 'HKCU\Software\Classes\notedeck\shell\open\command' 2>&1 | Out-String
          $global:LASTEXITCODE = 0

          Write-Host "===== E. protocol activation while running"
          try { Start-Process 'notedeck://proto-test/hello' } catch { Write-Host "protocol launch failed: $_" }
          Start-Sleep 10
          Get-Process notedeck -ErrorAction SilentlyContinue | Select-Object Name, Id, StartTime | Format-Table -AutoSize | Out-String
          Get-Process notedeck, notemaid -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          $logs = Get-ChildItem "$env:LOCALAPPDATA\com.notedeck.desktop\logs", "$priv\Local\com.notedeck.desktop\logs" -Filter *.log* -ErrorAction SilentlyContinue
          foreach ($l in $logs) {
            Write-Host "-- $($l.FullName) (written after start: $($l.LastWriteTime -gt $t0))"
            Select-String -Path $l.FullName -Pattern 'single-instance|deep-link|proto-test|user-notify|toast|notif' | Select-Object -Last 12 | ForEach-Object { $_.Line }
          }

          Write-Host "===== F. files the packaged app wrote"
          Write-Host "-- real Roaming, modified after start:"
          Get-ChildItem "$env:APPDATA\com.notedeck.desktop" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -gt $t0 } | ForEach-Object { $_.FullName.Replace($env:APPDATA, '') }
          Write-Host "-- real Local (EBWebView), files modified after start: $((Get-ChildItem "$env:LOCALAPPDATA\com.notedeck.desktop" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -gt $t0 }).Count)"
          Write-Host "-- private Roaming files: $((Get-ChildItem "$priv\Roaming" -Recurse -File -ErrorAction SilentlyContinue).Count)"
          Write-Host "-- private Local files:   $((Get-ChildItem "$priv\Local" -Recurse -File -ErrorAction SilentlyContinue).Count)"
          Get-ChildItem "$priv\Local" -Depth 1 -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName.Replace($priv, '') }

          Write-Host "===== G. after uninstall"
          Remove-AppxPackage -Package $pkg.PackageFullName
          Write-Host "private data dir remains: $(Test-Path "$env:LOCALAPPDATA\Packages\$pfn")"
          Write-Host "-- credential:"
          cmdkey /list:notedeck-proto-test | Out-String
          Write-Host "-- HKCU probe / Run value / protocol command:"
          reg query 'HKCU\Software\NoteDeckProtoTest' /v probe 2>&1 | Out-String
          reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v NoteDeckProtoRun 2>&1 | Out-String
          reg query 'HKCU\Software\Classes\notedeck\shell\open\command' 2>&1 | Out-String
          $global:LASTEXITCODE = 0
