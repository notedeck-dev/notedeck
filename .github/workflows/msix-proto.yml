# #849 の試作。公開済みの Windows 版を MSIX に包み、振り替えの挙動をサーバー OS とクライアント OS で測る。
# このブランチ専用で、main には入れない。
name: MSIX prototype (#849)

on:
  push:
    branches: [proto/msix-849]

jobs:
  proto:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 1.109.1
    steps:
      - uses: actions/checkout@v6

      - name: OS
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object OsName, OsVersion, OsBuildNumber, OsArchitecture | Format-List
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv

      - name: Stage the released build
        shell: pwsh
        run: |
          gh release download "v$env:VERSION" -p "NoteDeck-$env:VERSION-windows-x64-setup.exe" -D dl
          $setup = (Get-ChildItem dl\*.exe)[0].FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter notedeck.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "installed notedeck.exe not found" }
          $dir = $exe.DirectoryName
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item "$dir\*" stage -Recurse -Exclude 'uninstall.exe'
          New-Item -ItemType Directory stage\Assets | Out-Null
          Copy-Item src-tauri\icons\StoreLogo.png, src-tauri\icons\Square150x150Logo.png, src-tauri\icons\Square44x44Logo.png stage\Assets
          (Get-Content scripts\msix-proto\AppxManifest.xml -Raw).Replace('__VERSION__', $env:VERSION) | Set-Content stage\AppxManifest.xml -Encoding utf8
          $un = Join-Path $dir 'uninstall.exe'
          if (Test-Path $un) { Start-Process $un -ArgumentList '/S' -Wait }
          Start-Sleep 3
          Write-Host "== NSIS-registered protocol after uninstall (should be gone):"
          reg query 'HKCU\Software\Classes\notedeck\shell\open\command' 2>&1 | Out-String
          $global:LASTEXITCODE = 0

      - name: Pack and sign (self-signed, test only)
        shell: pwsh
        run: |
          $mk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Sort-Object FullName -Descending | Select-Object -First 1
          $bin = $mk.DirectoryName
          Write-Host "SDK: $bin"
          & "$bin\makeappx.exe" pack /d stage /p NoteDeck.msix /o | Select-Object -Last 2
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=NoteDeckProto' -KeyUsage DigitalSignature -FriendlyName 'NoteDeck proto' -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pwd = ConvertTo-SecureString -String 'proto' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath proto.pfx -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath proto.cer | Out-Null
          Import-Certificate -FilePath proto.cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          & "$bin\signtool.exe" sign /fd SHA256 /f proto.pfx /p proto NoteDeck.msix | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }

      # 併用 (#1437 のレビュー): 直接配布版が動いている状態で Store 版を開くとどうなるか、
      # 両方が登録されているとき URL スキームはどちらに届くか
      - name: Coexistence
        shell: pwsh
        run: |
          function Procs { Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'notedeck.exe' } | ForEach-Object { "  pid=$($_.ProcessId) $($_.ExecutablePath)" } }
          function DirectLog { Get-ChildItem "$env:LOCALAPPDATA\com.notedeck.desktop\logs" -Filter 'notedeck.log*' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName } }
          Add-AppxPackage -Path NoteDeck.msix
          $pkg = Get-AppxPackage -Name NotedeckDev.NoteDeck
          $pfn = $pkg.PackageFamilyName

          Write-Host "===== 1. direct version first, then open the Store version"
          Start-Process "$PWD\stage\notedeck.exe"
          Start-Sleep 25
          Write-Host "-- running after the direct version started:"; Procs
          Write-Host "-- HKCU scheme commands (the direct version registers at startup):"
          foreach ($sch in 'notedeck','notedeck-notification') { Write-Host ("  {0}: {1}" -f $sch, (Get-ItemProperty "HKCU:\Software\Classes\$sch\shell\open\command" -ErrorAction SilentlyContinue).'(default)') }
          Start-Process "shell:AppsFolder\$pfn!App"
          Start-Sleep 20
          Write-Host "-- running after opening the Store version:"; Procs
          Write-Host "-- forwarded launches seen by the direct version:"
          DirectLog | Select-String 'single-instance' | Select-Object -Last 3 | ForEach-Object { "  $($_.Line)" }

          Write-Host "===== 2. both registered: who receives the schemes (direct version still running)"
          Start-Process 'notedeck://coexist/one'
          Start-Sleep 8
          Start-Process 'notedeck-notification://coexist/__default__'
          Start-Sleep 8
          DirectLog | Select-String 'coexist' | Select-Object -Last 6 | ForEach-Object { "  $($_.Line)" }

          Write-Host "===== 3. Store version first, then open the direct version"
          Get-Process notedeck, notemaid -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          Start-Process "shell:AppsFolder\$pfn!App"
          Start-Sleep 25
          Write-Host "-- running after the Store version started:"; Procs
          Start-Process "$PWD\stage\notedeck.exe"
          Start-Sleep 20
          Write-Host "-- running after opening the direct version:"; Procs
          Write-Host "-- HKCU scheme commands now:"
          foreach ($sch in 'notedeck','notedeck-notification') { Write-Host ("  {0}: {1}" -f $sch, (Get-ItemProperty "HKCU:\Software\Classes\$sch\shell\open\command" -ErrorAction SilentlyContinue).'(default)') }
          Start-Process 'notedeck://coexist/two'
          Start-Sleep 8
          Write-Host "-- which exe Windows launched for the scheme (argv[0] of the forwarded launch), from either log:"
          $pkgLogs = Get-ChildItem "$env:LOCALAPPDATA\Packages\$pfn\LocalCache\Local\com.notedeck.desktop\logs" -Filter 'notedeck.log*' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
          (@(DirectLog) + @($pkgLogs)) | Select-String 'coexist/two' | ForEach-Object { "  $($_.Line)" }
          Get-Process notedeck, notemaid -ErrorAction SilentlyContinue | Stop-Process -Force
