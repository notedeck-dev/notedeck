# NoteDeck の UI 文言の正本 (#135)。ほかの言語はこのファイルから訳す。
#
# - キーを足したら `pnpm gen:i18n` で型を再生成してコミットする
# - 補間は `{name}`。コードからは i18n.tsx.<key>({ name }) で埋める
# - 複数形はキー名を `_plural` で終え、値を CLDR カテゴリ (other 必須) の
#   オブジェクトで書く。数は `{count}` で受ける
# - 名前空間は本家 (misskey-dev/misskey) と同じく `_` 始まりのキーで切る
# - 用語は locales/GLOSSARY.md に合わせる
# - capability の表示名 (_capabilities) はここに書かない。crates/notecore/capabilities.json5
#   の label が正本で、pnpm gen:i18n が辞書に取り込む

