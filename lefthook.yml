pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,vue}"
      run: npx biome check --no-errors-on-unmatched {staged_files}

    - name: typecheck
      glob: "*.{ts,vue}"
      run: npx vue-tsc -b --noEmit

    - name: docs-lint
      # site/ の訳 (#1145) は theme の辞書 (.ts) も原文ハッシュで照合する
      glob: "{*.md,site/.vitepress/theme/i18n/*.ts}"
      run: node scripts/docs-lint.mjs

    - name: rustfmt
      glob: "{src-tauri,crates}/**/*.rs"
      run: cargo fmt --all --check

    # 2 つの snapshot テストは同じビルドを共有するので 1 回の cargo test にまとめる。
    # 別ジョブに分けると target ディレクトリのロックで直列待ちが二重に発生する
    - name: rust-snapshots
      glob: "{src-tauri,crates}/**/*.{rs,toml,json}"
      run: cargo test -p notedeck --test openapi_snapshot --test bindings_snapshot --quiet

# develop へは PR ではなくローカルで merge して push するので、直書きの
# ラチェット (#135) は pre-commit ではなくここで push する範囲を検査する
pre-push:
  jobs:
    - name: i18n-lint
      run: node scripts/i18n-lint.ts --pre-push

commit-msg:
  jobs:
    - name: conventional-commits
      run: |
        msg=$(head -1 "{1}")
        if ! echo "$msg" | grep -qE '^(feat|fix|refactor|docs|test|chore|ci|style|perf|build|revert)(\(.+\))?: .+'; then
          echo "ERROR: Commit message must follow Conventional Commits format:"
          echo "  <type>(<scope>): <subject>"
          echo ""
          echo "  Types: feat, fix, refactor, docs, test, chore, ci, style, perf, build, revert"
          echo ""
          echo "  Got: $msg"
          exit 1
        fi
