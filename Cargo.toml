# notedeck の Cargo workspace (#1106 段階 0)。
# メンバー: src-tauri (アプリの Rust) / crates/notecli (Misskey クライアント + CLI) /
# crates/notecore (Tauri 非依存のドメイン層)。今後 crates/notecored をここに足す。プロファイルは workspace root にしか置けない。
[workspace]
resolver = "2"
members = ["src-tauri", "crates/notecli", "crates/notecore"]

# dev: 自分のコードは最速コンパイル、依存クレートだけ軽く最適化（実行速度とコンパイル速度のバランス）
# debug 情報は target/ 肥大の主因（[lib] の 3 crate-type × 重量級依存ツリーで掛け算になる）。
# 自分のコードは行番号のみ（パニック時のバックトレースは読める）、依存クレートは捨てる。
# 依存クレート内部をデバッガでステップ実行したいときだけ一時的にこの 2 行を外す。
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

# build script / proc-macro（デバッグ対象ではない）は debug 情報だけ落とす。
# opt-level は cargo のデフォルト（0）のままにして、コンパイル時間は変えない。
[profile.dev.build-override]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

