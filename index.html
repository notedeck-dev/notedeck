<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NoteDeck</title>
    <style>
      #nd-splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:var(--nd-bg,#232323);transition:opacity .3s cubic-bezier(.16,1,.3,1);overflow:hidden}
      #nd-splash.nd-splash-leaving{opacity:0}
      #nd-splash.nd-splash-leaving svg{transform:scale(.8);opacity:0}
      #nd-splash svg{transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .2s ease-out}
      #nd-splash svg{animation:nd-heartbeat 1.4s cubic-bezier(.4,0,.2,1) infinite,nd-heartglow 1.4s cubic-bezier(.4,0,.2,1) infinite;transform-origin:center;will-change:transform,filter}
      /* 待機: 心拍 lub-dub (本物の心臓リズム) + ビート同期グロー */
      @keyframes nd-heartbeat{0%,55%,100%{transform:scale(1)}10%{transform:scale(1.18)}22%{transform:scale(1)}32%{transform:scale(1.1)}44%{transform:scale(1)}}
      @keyframes nd-heartglow{0%,55%,100%{filter:none}10%,32%{filter:drop-shadow(0 0 14px #aad6359a)}}
      @media(prefers-reduced-motion:reduce){#nd-splash svg{animation:none;transition:none}#nd-splash{transition:none}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Boot script: restore theme CSS variables, then show splash until Vue mounts.
      (function () {
        var root = document.documentElement
        // 0. Safe mode (#794). CLI 引数 (--safe-mode → Rust の initialization script)
        //    と URL クエリを localStorage の 1 キーへ畳み込む。以降アプリ全体は
        //    このキーだけを見る (src/utils/safeMode.ts と同じリテラル)。
        var safeMode = false
        try {
          safeMode =
            localStorage.getItem('nd-safe-mode') === 'true' ||
            window.__ND_SAFE_MODE_ARG__ === true ||
            new URLSearchParams(location.search).get('safemode') === 'true'
          if (safeMode) localStorage.setItem('nd-safe-mode', 'true')
        } catch (e) {
          // localStorage 不可 — 通常起動として続行
        }
        try {
          // 1. Restore theme CSS variables (same data themeStore.init reads later)
          //    セーフモードではユーザーテーマを一切当てない (既定テーマで描画する)
          var compiled = safeMode ? null : localStorage.getItem('nd-theme-compiled')
          if (compiled) {
            var vars = JSON.parse(compiled)
            for (var k in vars) {
              if (Object.prototype.hasOwnProperty.call(vars, k)) {
                root.style.setProperty('--nd-' + k, vars[k])
              }
            }
            if (vars.bg) {
              var hex = vars.bg.replace('#', '')
              if (hex.length === 6) {
                var r = parseInt(hex.slice(0, 2), 16)
                var g = parseInt(hex.slice(2, 4), 16)
                var b = parseInt(hex.slice(4, 6), 16)
                var isLight = (r * 299 + g * 587 + b * 114) / 1000 > 128
                root.style.setProperty('color-scheme', isLight ? 'light' : 'dark')
                root.dataset.colorScheme = isLight ? 'light' : 'dark'
              }
            }
          }
          // 2. シェルキャッシュ (#985 で廃止) の残骸を消す。前回表示ノートの
          //    本文が平文で残っており、プライバシー面からも積極削除する
          localStorage.removeItem('nd-shell-cache')
          localStorage.removeItem('nd-shell-cache-version')
        } catch (e) {
          // localStorage 不可 — 通常起動として続行
        }
        // 3. Show splash until the Vue app mounts and dismisses it
        var splash = document.createElement('div')
        splash.id = 'nd-splash'
        splash.innerHTML = '<svg width="48" height="48" viewBox="0 0 512 512"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#aad635"/><stop offset="100%" stop-color="#7ab800"/></linearGradient></defs><g fill="url(#fg)"><rect x="72" y="136" width="100" height="280" rx="36"/><rect x="206" y="136" width="100" height="280" rx="36"/><rect x="340" y="136" width="100" height="280" rx="36"/><polygon points="136,136 189,224 242,136"/><polygon points="270,136 323,224 376,136"/></g></svg>'
        document.body.prepend(splash)
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
